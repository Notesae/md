name: Publish verified MD prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.2
        required: true
        type: string
      run_id:
        description: Successful Quality push-to-main CI run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: md-manual-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Notesae/md' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test publication guards without network or credentials
        run: python3 -m unittest discover -s tests -p 'test_publish_release.py' -v
      - name: Publish original verified CI assets and verify fresh Release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
        run: python3 scripts/publish_release.py
      - name: Retain publication state and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: md-publication-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/publish-release/*.json
          if-no-files-found: warn
          retention-days: 7
