name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Rust formatting
        run: npm run desktop -- fmt -- --check
      - name: Frontend typecheck and production build
        run: npm run build
      - name: Frontend and phase 6 contract tests
        run: npm test
      - name: Storage and document core tests
        run: npm run test:core -- --locked

  desktop:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Rust formatting
        run: npm run desktop -- fmt -- --check
      - name: Frontend typecheck and production build
        run: npm run build
      - name: Frontend behavior tests
        run: npm test
      - name: Storage and document core tests
        run: npm run test:core -- --locked
      - name: Desktop compilation
        run: npm run check:desktop -- --locked
      - name: Isolated updater handoff regressions (no application or installer launch)
        run: npm run desktop -- test --lib update_service::tests --locked
      - name: Release installer
        run: npm run build:desktop
      - name: Current-user install, association, and uninstall paths
        shell: powershell
        run: |
          $installer = Get-ChildItem .tools\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "没有找到 NSIS 安装包" }
          & .\tests\install-audit.ps1 -Installer $installer.FullName -WorkRoot (Join-Path (Get-Location) '.runtime\install-audit')
      - name: Package versioned Windows release files
        shell: powershell
        run: .\scripts\package-release.ps1
      - name: Archive versioned Windows release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: md-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/release-artifacts/*
          if-no-files-found: error
          retention-days: 7
