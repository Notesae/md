[package]
name = "md-reader"
version = "0.1.2"
description = "本地 Markdown 桌面阅读器"
edition = "2021"
rust-version = "1.85"

[lib]
name = "md_reader"
# Windows 桌面入口直接链接 Rust 库，调试符号由可执行文件生成。
crate-type = ["rlib"]

[[bin]]
name = "md-reader"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:tauri-plugin-single-instance", "dep:notify", "dep:open", "dep:tokio", "dep:reqwest"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
pulldown-cmark = "0.13"
percent-encoding = "2"
dunce = "1"
sha2 = "0.10"
semver = "1"
url = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri = { version = "2", features = [], optional = true }
rfd = { version = "0.15", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
notify = { version = "8", optional = true }
open = { version = "5", optional = true }
tokio = { version = "1", features = ["sync", "macros", "time"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
